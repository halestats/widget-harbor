name: Publish requested release
on:
  push:
    branches: [main]
    paths: ['.github/release-request.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-request
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read and validate release request
        id: request
        run: |
          python - <<'PY'
          import json, os, re
          d=json.load(open('.github/release-request.json'))
          assert re.fullmatch(r'v\d+\.\d+\.\d+',d['tag'])
          assert re.fullmatch(r'[0-9a-f]{40}',d['commit'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('tag='+d['tag']+'\ncommit='+d['commit']+'\nversion='+d['tag'][1:]+'\n')
          open('/tmp/release-notes.md','w').write(d['notes'])
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_ui.cjs
      - name: Package and publish release
        env:
          RELEASE_TAG: ${{ steps.request.outputs.tag }}
          TARGET_COMMIT: ${{ steps.request.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python scripts/package_release.py --version "$RELEASE_TAG" --output dist
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            actual=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
            test "$actual" = "$TARGET_COMMIT"
          else
            gh release create "$RELEASE_TAG" --target "$TARGET_COMMIT" --title "Widget Harbor $RELEASE_TAG" --notes-file /tmp/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt --clobber
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.name }}:${{ steps.request.outputs.version }}
