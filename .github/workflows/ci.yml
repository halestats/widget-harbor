name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js
      - run: node tests/test_ui.cjs
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t widget-harbor:ci .
      - name: Smoke test container
        shell: bash
        run: |
          docker run -d --name harbor-ci -p 127.0.0.1:8765:8765 \
            -e ADMIN_PASSWORD=ci-test-password-only \
            -e SITE_URL=http://localhost:8765 widget-harbor:ci
          trap 'docker logs harbor-ci; docker rm -fv harbor-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8765/healthz; then exit 0; fi
            sleep 1
          done
          exit 1
